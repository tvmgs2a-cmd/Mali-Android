
name: Build Mali APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project ZIP
        run: |
          test -f Mali-Android-3.1.2-fixed.zip

      - name: Extract Mali project
        run: |
          unzip -q Mali-Android-3.1.2-fixed.zip -d source
          test -f source/Mali-Android/app/build.gradle.kts

      - name: Build APK
        working-directory: source/Mali-Android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mali-APK
          path: source/Mali-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
