
name: Build Mali APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Mali project
        run: |
          unzip -q Mali-Android-3.1.2-fixed.zip -d source
          chmod +x source/Mali-Android/gradlew

      - name: Build debug APK
        working-directory: source/Mali-Android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mali-APK
          path: source/Mali-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
